<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLPT N3 단어 암기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1f1f1f; --card:#2b2b2a; --line:#3d3d3b; --text:#f4f1ec; --muted:#8d8a85;
  --accent:#f4a23c; --blue-bg:#11285c; --blue:#7db4ff; --ok:#3ecf8e; --bad:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding:14px 16px 22px;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;height:52px}
.round-btn{width:44px;height:44px;border-radius:50%;border:0;background:#3a3a39;display:grid;place-items:center;font-size:20px}
.title{font-size:18px;font-weight:700}

/* home */
.home h1{font-size:22px;margin:18px 0 4px}
.home p.sub{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.day{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px 6px;text-align:center}
.day b{display:block;font-size:17px}
.day span{font-size:12px;color:var(--muted)}
.day.sel{border-color:var(--accent);background:#3a2f1e}
.opts{margin:18px 0 6px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px}
.opt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sw{width:46px;height:28px;border-radius:14px;background:#4a4a48;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--accent)}
.sw.on::after{left:21px}
.primary{width:100%;border:0;border-radius:16px;background:var(--accent);color:#231a0a;font-weight:700;font-size:17px;padding:16px;margin-top:12px}
.primary:disabled{opacity:.4}
.count{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.favlist{margin-top:22px}
.favlist h3{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:500}
.favitem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.favitem .w{font-family:'Noto Serif JP',serif;font-size:19px}
.favitem .r{font-size:12px;color:var(--muted)}
.favitem .m{font-size:13px;margin-left:auto;text-align:right;color:#cfcac2;max-width:45%}
.favitem .d{font-size:11px;color:var(--blue);background:var(--blue-bg);border-radius:8px;padding:2px 7px;flex:none}
.star-mini{background:none;border:0;font-size:20px;color:var(--accent);padding:0 2px}

/* study */
.prog{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
.prog .n{font-weight:700;font-size:15px;min-width:52px}
.bar{flex:1;height:10px;border-radius:6px;background:#444;overflow:hidden}
.bar i{display:block;height:100%;background:#fbefe3;border-radius:6px;transition:width .25s}
.round-chip{font-size:12px;color:var(--muted);background:#333;border-radius:12px;padding:6px 10px;white-space:nowrap}
.card{flex:1;min-height:420px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px 20px 18px;display:flex;flex-direction:column;position:relative}
.card-head{display:flex;align-items:center;gap:10px}
.dayTag{background:var(--blue-bg);color:var(--blue);font-weight:700;font-size:15px;border-radius:20px;padding:9px 16px}
.star{background:none;border:0;font-size:30px;line-height:1;color:#555;padding:2px 4px}
.star.on{color:var(--accent)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 0;gap:6px}
.reading{font-family:'Noto Serif JP',serif;font-size:22px;color:#a8a49d;min-height:30px;letter-spacing:.08em}
.word{font-family:'Noto Serif JP',serif;color:#faf8f4;line-height:1.2;word-break:keep-all;font-weight:400}
.meaning{font-size:26px;font-weight:700;min-height:40px;margin-top:6px;padding:0 6px;line-height:1.35}
.card-foot{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.undo{width:52px;height:52px;border-radius:50%;border:1.5px solid #484846;background:transparent;font-size:20px;color:#9a968f;flex:none}
.undo:disabled{opacity:.35}
.reveal{flex:1;height:52px;border-radius:26px;border:1.5px solid #484846;background:transparent;font-size:17px;font-weight:500}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.ans{height:84px;border-radius:22px;font-size:21px;font-weight:700;border:1.5px solid #484846;background:#222}
.ans.ok{background:#2d2d2c;border-color:#2d2d2c}
.ans:disabled{opacity:.4}
.fade{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* result */
.result{text-align:center;padding-top:30px}
.result .big{font-size:56px}
.result h2{margin:6px 0 4px;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 4px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.missed{text-align:left;margin-top:8px}
.ghost{width:100%;border:1.5px solid #484846;background:transparent;border-radius:16px;padding:15px;font-size:16px;font-weight:500;margin-top:10px}
.resume{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;border:1.5px solid var(--accent);background:#3a2f1e;border-radius:16px;padding:14px 16px;margin-top:14px}
.resume b{font-size:16px}.resume small{display:block;color:#cdb89a;font-size:12px;margin-top:3px}.resume span{color:var(--accent);font-size:18px}
.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
@media (max-width:380px){.ans{height:72px;font-size:18px}.meaning{font-size:22px}}
</style>
</head>

<div id="app"></div>

  <div class="home fade">
    <div class="top"><div class="title">N3 단어 암기</div><div style="font-size:13px;color:var(--muted)">총 ${ALL.length}단어</div></div>
    ${saved ? `<button class="resume" id="resume"><div><b>이어하기 · DAY ${saved.day}${saved.prev?' (누적)':''}${saved.favOnly?' ⭐':''}</b><small>${saved.known}/${saved.total} 완료 · ${saved.round}회차 · 남은 ${saved.queue.length}</small></div><span>▶</span></button>` : ''}
    <h1>세트 선택</h1>
    <p class="sub">DAY를 고르면 그 날의 단어로 시작해요. 아래 옵션을 켜면 이전 일차 단어도 함께 나와요.</p>
    <div class="days">
      ${DATA.map((w,i)=>`<button class="day ${mem.cfg.day===i+1?'sel':''}" data-day="${i+1}"><b>DAY ${i+1}</b><span>${w.length}단어</span></button>`).join('')}
    </div>
    <div class="opts">
      <div class="opt" data-opt="prev"><div>이전 일차 단어 포함<small>DAY 1 ~ 선택한 DAY까지 누적</small></div><div class="sw ${mem.cfg.prev?'on':''}"></div></div>
      <div class="opt" data-opt="favOnly"><div>⭐ 즐겨찾기만 학습<small>즐겨찾기 ${favItems.length}개</small></div><div class="sw ${mem.cfg.favOnly?'on':''}"></div></div>
    </div>
    <button class="primary" id="start" ${pool.length?'':'disabled'}>학습 시작</button>
    <div class="count">${pool.length}단어 · 시작할 때마다 순서가 섞여요</div>
    ${favItems.length ? `
    <div class="favlist">
      <h3>⭐ 즐겨찾기 (${favItems.length})</h3>
      ${favItems.map(x=>`<div class="favitem"><span class="w">${esc(x.w)}</span>${x.r!==x.w?`<span class="r">${esc(x.r)}</span>`:''}<span class="m">${esc(x.m)}</span><span class="d">D${x.day}</span><button class="star-mini" data-unfav="${x.id}" aria-label="즐겨찾기 해제">★</button></div>`).join('')}
    </div>` : ''}
  </div>`;
  app.querySelectorAll('.day').forEach(b => b.onclick = () => { mem.cfg.day = +b.dataset.day; saveCfg(); renderHome(); });
  app.querySelectorAll('.opt').forEach(o => o.onclick = () => { const k=o.dataset.opt; mem.cfg[k]=!mem.cfg[k]; saveCfg(); renderHome(); });
  app.querySelectorAll('[data-unfav]').forEach(b => b.onclick = () => { favs.delete(b.dataset.unfav); saveFavs(); renderHome(); });
  $('#start').onclick = () => startSession(buildPool());
  const rs = $('#resume'); if(rs) rs.onclick = () => { S = loadSession(); if(S) renderStudy(); else renderHome(); };
}

function startSession(pool){
  if(!pool.length) return;
  S = { total: pool.length, queue: shuffle(pool), wrong: [], known: 0, round: 1, again: 0, missed: new Map(), revealed:false, hist: [], day: mem.cfg.day, prev: mem.cfg.prev, favOnly: mem.cfg.favOnly };
  saveSession();
  renderStudy();
}

function snapshot(){
  return JSON.stringify({ queue:S.queue.map(x=>x.id), wrong:S.wrong.map(x=>x.id), known:S.known, round:S.round, again:S.again, missed:[...S.missed] });
}
function restore(snap){
  const o = JSON.parse(snap), byId = Object.fromEntries(ALL.map(x=>[x.id,x]));
  S.queue = o.queue.map(i=>byId[i]); S.wrong = o.wrong.map(i=>byId[i]);
  S.known = o.known; S.round = o.round; S.again = o.again; S.missed = new Map(o.missed);
}

function answer(isKnown){
  if(!S || !S.queue.length) return;
  S.hist.push(snapshot());
  const cur = S.queue.shift();
  if(isKnown) S.known++;
  else { S.wrong.push(cur); S.again++; S.missed.set(cur.id, (S.missed.get(cur.id)||0)+1); }
  if(!S.queue.length && S.wrong.length){ S.queue = shuffle(S.wrong); S.wrong = []; S.round++; }
  S.revealed = false;
  if(!S.queue.length){ clearSession(); return renderResult(); }
  saveSession();
  renderStudy();
}
function undo(){
  if(!S || !S.hist.length) return;
  restore(S.hist.pop()); S.revealed = false; saveSession(); renderStudy();
}
function toggleFav(id){
  favs.has(id) ? favs.delete(id) : favs.add(id); saveFavs();
}

function wordSize(w){
  const n = [...w].length;
  return n<=3?72 : n<=4?62 : n<=5?52 : n<=6?44 : n<=8?36 : 30;
}

function renderStudy(){
  const c = S.queue[0];
  const pct = Math.round(S.known / S.total * 100);
  const showReading = c.r !== c.w;
  app.innerHTML = `
  <div class="fade">
    <div class="top">
      <button class="round-btn" id="back" aria-label="홈">‹</button>
      <div class="title">N3 단어 학습</div>
      <div style="width:44px"></div>
    </div>
    <div class="prog">
      <div class="n">${S.known}/${S.total}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="round-chip">${S.round}회차 · 남은 ${S.queue.length}</div>
    </div>
  </div>
  <div class="card fade" id="card">
    <div class="card-head">
      <div class="dayTag">DAY ${c.day}</div>
      <button class="star ${favs.has(c.id)?'on':''}" id="fav" aria-label="즐겨찾기">${favs.has(c.id)?'★':'☆'}</button>
    </div>
    <div class="stage">
      <div class="reading">${S.revealed && showReading ? esc(c.r) : ''}</div>
      <div class="word" style="font-size:${wordSize(c.w)}px">${esc(c.w)}</div>
      <div class="meaning">${S.revealed ? esc(c.m) : ''}</div>
    </div>
    <div class="card-foot">
      <button class="undo" id="undo" ${S.hist.length?'':'disabled'} aria-label="되돌리기">↩</button>
      ${S.revealed ? '' : '<button class="reveal" id="reveal">의미·히라가나</button>'}
    </div>
  </div>
  <div class="answers">
    <button class="ans" id="again">다시 학습</button>
    <button class="ans ok" id="known">알고있음</button>
  </div>
  <div class="hint">진행도는 자동 저장돼요 · Space: 정답 보기 · ← 다시 학습 · → 알고있음 · Z 되돌리기</div>`;
  $('#back').onclick = () => { if(confirm_()) renderHome(); };
  $('#fav').onclick = () => { toggleFav(c.id); const on=favs.has(c.id); const b=$('#fav'); b.classList.toggle('on',on); b.textContent = on?'★':'☆'; };
  $('#undo').onclick = undo;
  const rv = $('#reveal'); if(rv) rv.onclick = reveal;
  $('#again').onclick = () => answer(false);
  $('#known').onclick = () => answer(true);
}
// no native confirm in sandbox: leaving just returns home
function confirm_(){ return true; }

function reveal(){
  if(!S || S.revealed || !S.queue.length) return;
  S.revealed = true;
  const c = S.queue[0];
  $('.reading').textContent = (c.r !== c.w) ? c.r : '';
  $('.meaning').textContent = c.m;
  const rv = $('#reveal'); if(rv) rv.remove();
}

function renderResult(){
  const missed = [...S.missed.entries()].map(([id,n])=>({x:ALL.find(a=>a.id===id), n})).sort((a,b)=>b.n-a.n);
  const nextDay = Math.min(DAYS, (S.day||1)+1);
  const canNext = !S.favOnly && (S.day||1) < DAYS;
  app.innerHTML = `
  <div class="result fade">
    <div class="big">🎉</div>
    <h2>모든 단어를 외웠어요!</h2>
    <div class="stats">
      <div class="stat"><b>${S.total}</b><span>전체 단어</span></div>
      <div class="stat"><b>${S.round}</b><span>회차</span></div>
      <div class="stat"><b>${S.again}</b><span>다시 학습</span></div>
    </div>
    ${missed.length ? `<div class="favlist missed"><h3>헷갈렸던 단어 (${missed.length})</h3>
      ${missed.map(({x,n})=>`<div class="favitem"><span class="w">${esc(x.w)}</span>${x.r!==x.w?`<span class="r">${esc(x.r)}</span>`:''}<span class="m">${esc(x.m)}</span><span class="d">×${n}</span><button class="star-mini" data-fav="${x.id}">${favs.has(x.id)?'★':'☆'}</button></div>`).join('')}
    </div>` : ''}
    ${canNext ? `<button class="primary" id="next">다음 세트 DAY ${nextDay} (이전 단어 포함)</button>` : ''}
    <button class="ghost" id="again2">이 세트 다시 (순서 섞기)</button>
    <button class="ghost" id="home">홈으로</button>
  </div>`;
  app.querySelectorAll('[data-fav]').forEach(b => b.onclick = () => { toggleFav(b.dataset.fav); b.textContent = favs.has(b.dataset.fav)?'★':'☆'; });
  const nx = $('#next'); if(nx) nx.onclick = () => { mem.cfg.day = nextDay; mem.cfg.prev = true; saveCfg(); startSession(buildPool()); };
  $('#again2').onclick = () => startSession(buildPool());
  $('#home').onclick = renderHome;
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if(!S || !S.queue.length) return;
  if(e.code==='Space' || e.code==='Enter'){ e.preventDefault(); reveal(); }
  else if(e.code==='ArrowRight'){ answer(true); }
  else if(e.code==='ArrowLeft'){ answer(false); }
  else if(e.key==='z' || e.key==='Z'){ undo(); }
  else if(e.key==='s' || e.key==='S'){ $('#fav') && $('#fav').click(); }
});

renderHome();
</script>
</body>
</html>
